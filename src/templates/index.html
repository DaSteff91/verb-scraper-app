{% extends "base.html" %} {% block content %}
<div class="row justify-content-center" x-data="scrapeComponent()">
  <div class="col-12 col-lg-10 col-xl-8">
    <div
      class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3 w-100"
      style="z-index: 1080; max-width: min(100%, 22rem); pointer-events: none"
      x-show="toast.visible"
      x-transition
      aria-live="polite"
      aria-atomic="true"
      role="status"
    >
      <div
        class="toast show border-0 shadow mx-auto"
        style="pointer-events: auto"
        :class="toast.type === 'error' ? 'bg-danger text-white' : 'bg-success text-white'"
      >
        <div class="d-flex">
          <div class="toast-body" x-text="toast.message"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            aria-label="Close"
            @click="hideToast()"
          ></button>
        </div>
      </div>
    </div>

    <section class="modern-card p-4 p-md-5 mb-4">
      <form id="scrapeForm" @submit.prevent="scrapeNow">
        <div class="mb-5">
          <div class="row g-3 align-items-sm-center scrape-verb-row">
            <div class="col-12 col-sm-8">
              <label for="verb" class="form-label small text-uppercase mb-3"
                >Portuguese Infinitive</label
              >
              <input
                type="text"
                class="form-control py-3"
                id="verb"
                name="verb"
                placeholder="e.g., sentir, comer, ser"
                required
                autofocus
                x-model="verb"
              />
              <div class="form-text text-muted small mt-2">
                One verb or a comma-separated list.
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <button
                type="submit"
                class="btn btn-primary w-100 py-3"
                :disabled="isProcessing"
              >
                <span x-show="!isProcessing">Scrape</span>
                <span
                  x-show="isProcessing"
                  class="spinner-border spinner-border-sm"
                  aria-hidden="true"
                ></span>
              </button>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <!-- Mode Selection -->
          <div class="col-12">
            <fieldset>
              <legend class="small text-uppercase mb-3">
                Grammatical Mode
              </legend>
              <div class="d-flex flex-wrap gap-2">
                <template x-for="m in ['Indicativo', 'Subjuntivo']" :key="m">
                  <button
                    type="button"
                    class="btn btn-pill flex-grow-1 flex-md-grow-0"
                    :class="selectedModes.includes(m) ? 'btn-primary' : 'btn-outline-secondary'"
                    x-text="m"
                    @click="toggleMode(m)"
                    :aria-pressed="selectedModes.includes(m)"
                  ></button>
                </template>
              </div>
            </fieldset>
          </div>

          <!-- Tense Selection -->
          <div class="col-12">
            <fieldset>
              <div
                class="d-flex justify-content-between align-items-end flex-nowrap mb-3"
              >
                <legend class="small text-uppercase m-0 text-nowrap">
                  Tense Selection
                </legend>
                <button
                  type="button"
                  class="btn btn-link btn-sm p-0 text-decoration-none text-white fw-bold text-nowrap ms-2"
                  @click="toggleAllTenses()"
                  x-text="selectedTenses.length === availableTenses.length ? 'Clear All' : 'Select All'"
                ></button>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <template x-for="t in availableTenses" :key="t">
                  <button
                    type="button"
                    class="btn btn-pill flex-grow-1 flex-md-grow-0"
                    :class="selectedTenses.includes(t) ? 'btn-primary' : 'btn-outline-secondary'"
                    @click="toggleTense(t)"
                    x-text="t"
                    :aria-pressed="selectedTenses.includes(t)"
                  ></button>
                </template>
              </div>
            </fieldset>
          </div>
        </div>

      </form>
    </section>

    <section class="modern-card p-4" x-show="sessionSummary.length > 0" x-transition>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 fw-bold text-uppercase text-white mb-0">Scrape Summary</h2>
        <button
          type="button"
          class="btn btn-link btn-sm text-decoration-none text-white fw-bold p-0"
          @click="showSummary = !showSummary"
          x-text="showSummary ? 'Hide Details' : 'View Details'"
        ></button>
      </div>

      <p class="text-muted small mb-3">
        <span x-text="sessionSummary.length"></span> scraped selection(s) in this session.
      </p>

      <div x-show="showSummary" x-transition>
        <div
          class="d-flex flex-column flex-sm-row flex-wrap gap-3 align-items-stretch align-items-sm-end mb-3"
        >
          <div class="flex-grow-1">
            <label
              for="summary-filename"
              class="form-label small text-uppercase mb-2"
              >Export Filename</label
            >
            <div class="input-group">
              <input
                type="text"
                id="summary-filename"
                class="form-control"
                x-model="filename"
                placeholder="verbs_export"
              />
              <span class="input-group-text">.csv</span>
            </div>
          </div>
          <button
            type="button"
            class="btn btn-outline-secondary"
            @click="downloadCombined()"
          >
            Download
          </button>
        </div>

        <div class="accordion" id="sessionSummaryAccordion">
          <template x-for="(item, index) in sessionSummary" :key="item.key">
            <article class="accordion-item modern-card mb-3 border-0 overflow-hidden">
              <h3 class="accordion-header">
                <button
                  class="accordion-button collapsed bg-transparent text-white py-3"
                  type="button"
                  data-bs-toggle="collapse"
                  :data-bs-target="'#summary-collapse-' + index"
                >
                  <div class="d-flex flex-column align-items-start">
                    <strong class="text-uppercase ls-wide" x-text="item.verb"></strong>
                    <span class="text-muted small" x-text="item.mode + ' | ' + item.tense"></span>
                  </div>
                </button>
              </h3>
              <div
                class="accordion-collapse collapse"
                :id="'summary-collapse-' + index"
                data-bs-parent="#sessionSummaryAccordion"
              >
                <div class="accordion-body border-top border-secondary border-opacity-25 p-0">
                  <table class="table table-dark table-sm mb-0" style="--bs-table-bg: transparent">
                    <tbody>
                      <template x-for="conj in item.conjugations" :key="item.key + '-' + conj.person">
                        <tr>
                          <td class="ps-4 py-2 text-muted small" style="width: 35%" x-text="conj.person"></td>
                          <td class="pe-4 py-2 fw-bold text-white" x-text="conj.value"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="p-3 border-top border-secondary border-opacity-25">
                    <button
                      type="button"
                      class="btn btn-outline-secondary btn-sm"
                      @click="downloadSingle(item)"
                    >
                      Download CSV
                    </button>
                  </div>
                </div>
              </div>
            </article>
          </template>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  function scrapeComponent() {
    return {
      isProcessing: false,
      verb: "",
      filename: "verbs_export",
      toast: { visible: false, type: "success", message: "" },
      toastTimer: null,
      showSummary: false,
      sessionSummary: [],
      sessionTasks: [],
      selectedModes: ["Indicativo"],
      selectedTenses: ["Presente"],
      mapping: {
        Indicativo: [
          "Presente",
          "Pretérito Imperfeito",
          "Pretérito Perfeito",
          "Pretérito Mais-que-perfeito",
          "Futuro do Presente",
          "Futuro do Pretérito",
        ],
        Subjuntivo: ["Presente", "Pretérito Imperfeito", "Futuro"],
      },
      get availableTenses() {
        let tenses = new Set();
        this.selectedModes.forEach((m) => {
          if (this.mapping[m]) this.mapping[m].forEach((t) => tenses.add(t));
        });
        return Array.from(tenses);
      },
      toggleMode(m) {
        if (this.selectedModes.includes(m)) {
          if (this.selectedModes.length > 1) {
            this.selectedModes = this.selectedModes.filter((i) => i !== m);
          }
        } else {
          this.selectedModes.push(m);
        }
        this.selectedTenses = this.selectedTenses.filter((t) =>
          this.availableTenses.includes(t),
        );
      },
      toggleTense(t) {
        if (this.selectedTenses.includes(t)) {
          if (this.selectedTenses.length > 1) {
            this.selectedTenses = this.selectedTenses.filter((i) => i !== t);
          }
        } else {
          this.selectedTenses.push(t);
        }
      },
      toggleAllTenses() {
        this.selectedTenses.length === this.availableTenses.length
          ? (this.selectedTenses = [])
          : (this.selectedTenses = [...this.availableTenses]);
      },
      showToast(type, message) {
        if (this.toastTimer) {
          clearTimeout(this.toastTimer);
        }
        this.toast = { visible: true, type, message };
        this.toastTimer = setTimeout(() => {
          this.hideToast();
        }, 3000);
      },
      hideToast() {
        if (this.toastTimer) {
          clearTimeout(this.toastTimer);
          this.toastTimer = null;
        }
        this.toast.visible = false;
      },
      upsertSummary(items) {
        items.forEach((item) => {
          const key = `${item.verb}|${item.mode}|${item.tense}`;
          const normalized = { ...item, key };
          const existingIndex = this.sessionSummary.findIndex((i) => i.key === key);
          if (existingIndex >= 0) {
            this.sessionSummary.splice(existingIndex, 1, normalized);
          } else {
            this.sessionSummary.unshift(normalized);
          }
        });
      },
      setTasks(tasks) {
        tasks.forEach((task) => {
          const exists = this.sessionTasks.some(
            (t) => t.verb === task.verb && t.mode === task.mode && t.tense === task.tense,
          );
          if (!exists) this.sessionTasks.push(task);
        });
      },
      async scrapeNow() {
        const verbClean = this.verb.trim().toLowerCase();
        if (!verbClean || this.isProcessing) return;

        this.isProcessing = true;
        this.hideToast();

        try {
          const response = await fetch("/scrape-summary", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              verb: verbClean,
              modes: this.selectedModes,
              tenses: this.selectedTenses,
              filename: this.filename || "verbs_export",
            }),
          });

          const payload = await response.json();
          if (!response.ok) {
            this.showToast("error", payload.error || "Scrape failed.");
            return;
          }

          this.filename = payload.filename || this.filename;
          this.setTasks(payload.tasks || []);
          this.upsertSummary(payload.summary || []);
          this.showToast("success", payload.message || "Scrape complete.");
          this.verb = "";
        } catch (error) {
          this.showToast("error", "Connection error. Please try again.");
        } finally {
          this.isProcessing = false;
        }
      },
      downloadSingle(item) {
        const basePath = `/export/${encodeURIComponent(item.verb)}`;
        const url = new URL(basePath, window.location.origin);
        url.searchParams.append("mode", item.mode);
        url.searchParams.append("tense", item.tense);
        if (this.filename) url.searchParams.append("filename", this.filename);
        window.location.href = url.href;
      },
      downloadCombined() {
        if (!this.sessionTasks.length) return;
        const basePath = "/export-batch";
        const url = new URL(basePath, window.location.origin);
        url.searchParams.append("tasks", JSON.stringify(this.sessionTasks));
        url.searchParams.append("filename", this.filename || "session_export");
        window.location.href = url.href;
      },
    };
  }
</script>
{% endblock %}
