services:
  verb-scraper:
    build: .
    container_name: verb-scraper-app
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-default-insecure-key}
      - API_KEY=${API_KEY:-default-insecure-api-key}
      - LOG_LEVEL=INFO
    ports:
      # Host Caddy terminates TLS; do not expose the app port on all interfaces
      - "127.0.0.1:5050:5050"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # This is the "Recommended Approach" for SQLite
      # It maps the local 'instance' folder to the container's folder
      - ./instance:/app/instance
